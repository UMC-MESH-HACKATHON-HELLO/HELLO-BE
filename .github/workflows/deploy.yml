name: Deploy to Cloud Server

on:
  push:
    branches:
      - main  # main 브랜치에 푸시가 일어나면 작동합니다.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH로 클라우드 서버에 원격 접속하여 명령어 실행
      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}       # pem 키를 쓰신다면 이것 사용
          # password: ${{ secrets.SERVER_PASSWORD }} # 비밀번호 방식을 쓰신다면 key 대신 이것 사용
          script: |
            # 1. 프로젝트 폴더로 이동 (본인의 실제 서버 내 프로젝트 경로로 수정하세요)
            cd /home/ubuntu/HELLO-BE 
            
            # 2. 최신 코드 가져오기
            git pull origin main
            
            # 3. 백엔드 서비스만 콕 집어서 새로 빌드하고 무중단/재실행
            docker compose up -d --build hello-backend
            
            # 4. 미사용 더미 이미지 정리 (서버 용량 관리용)
            docker image prune -f
